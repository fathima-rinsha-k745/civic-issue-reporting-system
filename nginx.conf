server {
    listen 80;
    server_name ec2-16-171-161-62.eu-north-1.compute.amazonaws.com 16.171.161.62;

    client_max_body_size 20M;

    # ── Serve React frontend (built dist/) ──────────────────────────────────
    root /home/ubuntu/miniProject/frontend/dist;
    index index.html;

    # ── Django static files ─────────────────────────────────────────────────
    location /static/ {
        alias /home/ubuntu/miniProject/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Django media files (uploaded images) ────────────────────────────────
    location /media/ {
        alias /home/ubuntu/miniProject/backend/media/;
        expires 7d;
    }

    # ── Django API endpoints (proxy to Gunicorn) ────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Django admin ────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── React Router — serve index.html for any unknown route ───────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
